name: keepalive
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Запрос к базе
        run: |
          curl -sS --fail -X POST "https://nltremspmuuasksxbqtk.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_EB1WIiL4hcJNxK40-OqDlQ_94uiWrrz" \
            -H "Content-Type: application/json" -d '{}'
